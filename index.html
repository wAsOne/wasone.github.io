<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smile — общая карта</title>  <script type="module" crossorigin src="/assets/index-Dd96GXtY.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-2ShRfKWV.css">
</head>
<body>
  <div id="game"></div>
  <main id="login">
    <form id="login-form">
      <h1>Smile</h1><p>Общая карта и разговоры рядом</p>
      <label>Имя пользователя<input id="nickname" minlength="2" maxlength="20" required autocomplete="username"></label>
      <label>Пароль<input id="password" type="password" minlength="10" maxlength="128" required autocomplete="current-password"></label>
      <section id="registration" hidden>
        <div id="register-preview" class="preview-host"></div>
        <button id="reroll" type="button">Другой цвет</button>
        <p class="small">Цвет выбирает сервер. После регистрации он сохраняется.</p>
      </section>
      <button id="auth-submit" type="submit">Войти</button>
      <button id="auth-toggle" type="button" class="secondary">Регистрация</button>
      <p id="error" role="alert"></p>
    </form>
  </main>
  <div id="hud" hidden>
    <button id="online-count" type="button" aria-haspopup="dialog" aria-expanded="false">Онлайн …</button>
    <div id="hint">
      <button id="help-toggle" type="button" aria-controls="help-content" aria-expanded="true" aria-label="Свернуть подсказку">−</button>
      <div id="help-content">
        <strong>Управление</strong><br>WASD / стрелки — движение<br>ЛКМ — идти к курсору · E — объект<br>Enter — чат · Esc — отмена
        <div class="help-rp"><strong>RP-команды</strong><br>/me — действие · /do — описание<br>/try — попытка · /w — шёпот<br>/s — сообщение всем</div>
      </div>
    </div>
    <div id="account"><span id="account-name"></span><button id="logout" type="button">Выйти</button><span id="connection-status" role="status"></span></div>
    <div id="interaction-hint" role="status"></div><section id="chat"><div id="history" role="log" aria-live="polite"></div><input id="message" maxlength="200" placeholder="Enter — написать сообщение" aria-label="Сообщение"></section>
  </div>
</body>
</html>
